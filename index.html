<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manufactura</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #vignette {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%);
    }

    #hint {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(210, 210, 210, 0.6);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 20;
      pointer-events: none;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    #title-card {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #title-card h1 {
      font-size: 48px;
      color: #cfcfcf;
      letter-spacing: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    #title-card p {
      font-size: 14px;
      color: rgba(180, 180, 180, 0.4);
      letter-spacing: 6px;
    }

    #flicker {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 25;
      pointer-events: none;
      opacity: 1;
    }

    #focus-panel {
      position: fixed;
      left: 50%;
      top: 83%;
      transform: translate(-50%, -50%);
      width: min(86vw, 560px);
      z-index: 30;
      color: #ddd;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translate(-50%, -50%) scale(0.92);
    }

    #focus-panel.visible {
      pointer-events: auto;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #focus-title {
      font-size: 18px;
      letter-spacing: 4px;
      color: #9a9a9a;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    #focus-text {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(158, 158, 158, 0.9);
      text-align: center;
      margin-bottom: 18px;
    }

    body {
      cursor: none;
    }

    #focus-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      background: transparent;
      mix-blend-mode: exclusion;
      z-index: 40;
      pointer-events: none;
      opacity: 1;
      transform: scale(0.7);
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    /* slightly larger ring when hovering a card (and stays that size focused) */
    #focus-cursor.hover,
    #focus-cursor.focus {
      transform: scale(1.0);
    }
    #focus-cursor::before,
    #focus-cursor::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px; height: 2px;
      background: rgba(255, 255, 255, 0.95);
      opacity: 0;
      transition: transform 0.28s ease-out, opacity 0.45s ease-out;
    }
    #focus-cursor::before {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    #focus-cursor::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }
    /* hover on a card → plus sign */
    #focus-cursor.hover::before,
    #focus-cursor.hover::after {
      opacity: 1;
    }
    /* focused → the plus smoothly rotates into a multiplication cross */
    #focus-cursor.focus::before {
      transform: translate(-50%, -50%) rotate(45deg);
      opacity: 1;
    }
    #focus-cursor.focus::after {
      transform: translate(-50%, -50%) rotate(135deg);
      opacity: 1;
    }
    body.focused {
      cursor: none;
    }

    /* ===== Mode toggle: two icon buttons; active gets a growing dark circle ===== */
    #mode-toggle {
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 16px;
      background: none;
      user-select: none;
    }
    #mode-toggle .seg {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      outline: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #777;              /* inactive icon: dark grey, visible */
      cursor: pointer;
      transition: color 0.2s ease;
    }
    #mode-toggle .seg::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #2a2a2a;      /* dark grey circle behind the active icon */
      transform: scale(0);
      transition: transform 0.35s ease;
    }
    #mode-toggle .seg:hover {
      color: #bbb;
    }
    #mode-toggle .seg.active {
      color: #fff;              /* active icon: white */
    }
    #mode-toggle .seg.active::before {
      transform: scale(1);      /* grows from 0px on mode change */
    }
    #mode-toggle .seg svg {
      position: relative;
      display: block;
      width: 17px;
      height: 17px;
      fill: currentColor;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="flicker"></div>

  <div id="overlay">
    <div id="vignette"></div>
  </div>

  <div id="title-card">
    <h1>МАНУФАКТУРА</h1>
    <p>скролль — мы идём вглубь</p>
  </div>

  <div id="hint">скролл</div>

  <div id="focus-panel">
    <h2 id="focus-title">Без названия</h2>
    <p id="focus-text">Здесь будет описание работы. Кликните на любую карточку в галерее, чтобы увидеть её крупным планом.</p>
  </div>

  <div id="focus-cursor"></div>

  <div id="mode-toggle" data-mode="corridor" title="Коридор / Плитки (T)">
    <button class="seg active" data-seg="corridor" aria-label="Коридор">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M14 6.5V12.5C14 12.7652 13.8946 13.0196 13.7071 13.2071C13.5196 13.3946 13.2652 13.5 13 13.5H3C2.73478 13.5 2.48043 13.3946 2.29289 13.2071C2.10536 13.0196 2 12.7652 2 12.5V6.5C2 6.23478 2.10536 5.98043 2.29289 5.79289C2.48043 5.60536 2.73478 5.5 3 5.5H13C13.2652 5.5 13.5196 5.60536 13.7071 5.79289C13.8946 5.98043 14 6.23478 14 6.5ZM3.5 4.5H12.5C12.6326 4.5 12.7598 4.44732 12.8536 4.35355C12.9473 4.25979 13 4.13261 13 4C13 3.86739 12.9473 3.74021 12.8536 3.64645C12.7598 3.55268 12.6326 3.5 12.5 3.5H3.5C3.36739 3.5 3.24021 3.55268 3.14645 3.64645C3.05268 3.74021 3 3.86739 3 4C3 4.13261 3.05268 4.25979 3.14645 4.35355C3.24021 4.44732 3.36739 4.5 3.5 4.5ZM4.5 2.5H11.5C11.6326 2.5 11.7598 2.44732 11.8536 2.35355C11.9473 2.25979 12 2.13261 12 2C12 1.86739 11.9473 1.74021 11.8536 1.64645C11.7598 1.55268 11.6326 1.5 11.5 1.5H4.5C4.36739 1.5 4.24021 1.55268 4.14645 1.64645C4.05268 1.74021 4 1.86739 4 2C4 2.13261 4.05268 2.25979 4.14645 2.35355C4.24021 2.44732 4.36739 2.5 4.5 2.5Z"/></svg>
    </button>
    <button class="seg" data-seg="tiles" aria-label="Плитки">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M2.75 2C2.55109 2 2.36032 2.07902 2.21967 2.21967C2.07902 2.36032 2 2.55109 2 2.75V4.25C2 4.44891 2.07902 4.63968 2.21967 4.78033C2.36032 4.92098 2.55109 5 2.75 5H6.5C6.69891 5 6.88968 4.92098 7.03033 4.78033C7.17098 4.63968 7.25 4.44891 7.25 4.25V2.75C7.25 2.55109 7.17098 2.36032 7.03033 2.21967C6.88968 2.07902 6.69891 2 6.5 2H2.75ZM2.75 6.5C2.55109 6.5 2.36032 6.57902 2.21967 6.71967C2.07902 6.86032 2 7.05109 2 7.25V8.75C2 8.94891 2.07902 9.13968 2.21967 9.28033C2.36032 9.42098 2.55109 9.5 2.75 9.5H6.5C6.69891 9.5 6.88968 9.42098 7.03033 9.28033C7.17098 9.13968 7.25 8.94891 7.25 8.75V7.25C7.25 7.05109 7.17098 6.86032 7.03033 6.71967C6.88968 6.57902 6.69891 6.5 6.5 6.5H2.75ZM2.75 11C2.55109 11 2.36032 11.079 2.21967 11.2197C2.07902 11.3603 2 11.5511 2 11.75V13.25C2 13.4489 2.07902 13.6397 2.21967 13.7803C2.36032 13.921 2.55109 14 2.75 14H6.5C6.69891 14 6.88968 13.921 7.03033 13.7803C7.17098 13.6397 7.25 13.4489 7.25 13.25V11.75C7.25 11.5511 7.17098 11.3603 7.03033 11.2197C6.88968 11.079 6.69891 11 6.5 11H2.75ZM9.5 2C9.30109 2 9.11032 2.07902 8.96967 2.21967C8.82902 2.36032 8.75 2.55109 8.75 2.75V4.25C8.75 4.44891 8.82902 4.63968 8.96967 4.78033C9.11032 4.92098 9.30109 5 9.5 5H13.25C13.4489 5 13.6397 4.92098 13.7803 4.78033C13.921 4.63968 14 4.44891 14 4.25V2.75C14 2.55109 13.921 2.36032 13.7803 2.21967C13.6397 2.07902 13.4489 2 13.25 2H9.5ZM9.5 6.5C9.30109 6.5 9.11032 6.57902 8.96967 6.71967C8.82902 6.86032 8.75 7.05109 8.75 7.25V8.75C8.75 8.94891 8.82902 9.13968 8.96967 9.28033C9.11032 9.42098 9.30109 9.5 9.5 9.5H13.25C13.4489 9.5 13.6397 9.42098 13.7803 9.28033C13.921 9.13968 14 8.94891 14 8.75V7.25C14 7.05109 13.921 6.86032 13.7803 6.71967C13.6397 6.57902 13.4489 6.5 13.25 6.5H9.5Z"/></svg>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="images.js"></script>
  <script>
    const corridorHeight = 6;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x050505, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 0);
    camera.lookAt(0, 1.7, -20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.prepend(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x333333, 0.35);
    scene.add(ambientLight);

    const lights = [];
    const LIGHT_STEP = 8;           // spotlight spacing along the corridor
    const LIGHT_LOOP = 40;          // spotlight sweep span (8 * 20 positions)
    for (let i = 0; i < 20; i++) {
      const light = new THREE.PointLight(0xffffff, 0.55, 26);
      scene.add(light);
      lights.push({ light, base: -(i + 1) * LIGHT_STEP });
    }

    // ===== Cards on the sides, facing the traveler =====
    const loader = new THREE.TextureLoader();
    const photoTextures = IMAGE_DATA.map(uri => {
      const t = loader.load(uri);
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    });

    const CARD_GAP = 4;
    const NUM_CARDS = 16;
    const CARD_BASE = 2.3;         // base width of every card
    const SIDE_SPREAD = 2.4;
    const LOOP = NUM_CARDS * CARD_GAP;

    const cards = [];
    for (let i = 0; i < NUM_CARDS; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const tex = photoTextures[i % photoTextures.length];
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        color: 0xffffff,
        toneMapped: false,
        transparent: true,
        depthWrite: false,
        opacity: 1
      });
      // Geometry is created square; the real aspect ratio is applied via scale.y once
      // the texture loads, so every card keeps its true picture format (portrait/landscape/square).
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_BASE, CARD_BASE), mat);
      mesh.frustumCulled = false;
      scene.add(mesh);
      const card = {
        mesh,
        baseline: -(i + 1) * CARD_GAP,
        x: side * SIDE_SPREAD,
        y: 1.7,
        index: i,
        aspect: 1,
        zoom: 1
      };
      // Apply the real aspect as soon as the image dimensions are known
      tex.image ? applyAspect(card) : (() => {
        const check = setInterval(() => {
          if (tex.image) { clearInterval(check); applyAspect(card); }
        }, 30);
      })();
      mesh.userData.card = card;
      cards.push(card);
    }

    function applyAspect(card) {
      const img = card.mesh.material.map.image;
      if (!img || !img.width || !img.height) return;
      card.aspect = img.height / img.width;      // >1 portrait, <1 landscape
      card.mesh.scale.y = card.aspect;           // base height = width * aspect
    }

    // ===== Mode switch: corridor (0) <-> tiles (1) =====
    let mode = 'corridor';
    let blend = 0;
    let blendTarget = 0;
    const BLEND_SPEED = 2.2;
    const camLook = new THREE.Vector3();
    const camLookV = new THREE.Vector3();
    const camLookP = new THREE.Vector3();

    // Tiles (vertical 2-column tape) constants
    const TILE_COL_SPREAD = 2.2;
    const TILE_ROW_GAP = 4.4;
    const TILE_CAM_Z = 9;
    const TILE_VIEW = 26;
    const TILE_PERIOD_Y = (NUM_CARDS / 2) * TILE_ROW_GAP;

    // ===== Scroll input + stable smoothing (camera goes deeper / tape scrolls) =====
    let target = 0;
    let mid = 0;
    let depth = 0;
    let tileScroll = 0;
    let tileScrollTarget = 0;
    let prevTime = performance.now();

    const WHEEL_SPEED = 0.032;
    const TOUCH_SPEED = 0.1;

    function addScrollInput(d) {
      target += d;
      if (target < 0) target = 0;
      if (target > 100000) target = 100000;
    }

    function addTileScrollInput(d) {
      tileScrollTarget += d;
      if (tileScrollTarget > 200000) tileScrollTarget = 200000;
      if (tileScrollTarget < -200000) tileScrollTarget = -200000;
    }

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 33;
      else if (e.deltaMode === 2) d *= window.innerHeight;
      if (mode === 'tiles') addTileScrollInput(d * WHEEL_SPEED * 1.7);
      else addScrollInput(d * WHEEL_SPEED);
    }, { passive: false });

    let lastTouchY = null;
    window.addEventListener('touchstart', (e) => {
      lastTouchY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (lastTouchY !== null) {
        if (mode === 'tiles') addTileScrollInput((lastTouchY - e.touches[0].clientY) * TOUCH_SPEED * 2);
        else addScrollInput((lastTouchY - e.touches[0].clientY) * TOUCH_SPEED);
      }
      lastTouchY = e.touches[0].clientY;
    }, { passive: false });
    window.addEventListener('touchend', () => {
      lastTouchY = null;
    }, { passive: true });

    const titleCard = document.getElementById('title-card');
    const hintEl = document.getElementById('hint');

    // ===== Click-to-focus: camera dives to the card, others dissolve =====
    const mouse = new THREE.Vector2();
    const focusCursorEl = document.getElementById('focus-cursor');
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      focusCursorEl.style.left = e.clientX + 'px';
      focusCursorEl.style.top = e.clientY + 'px';
      // Ring → plus when hovering a card (unless the focus cross is active)
      if (!focusCard) {
        hoverCard = cardUnderCursor();
        focusCursorEl.classList.toggle('hover', !!hoverCard);
      } else {
        hoverCard = null;
      }
    }, false);

    // Pick exactly the card under the cursor via raycast against the card planes.
    const raycaster = new THREE.Raycaster();
    function cardUnderCursor() {
      raycaster.setFromCamera(mouse, camera);
      // Only cards right ahead of the camera can be hit
      const candidates = cards.filter(c => {
        const cdz = c.mesh.position.z - camera.position.z;
        return cdz < 0 && cdz > -14.001 && c.mesh.visible;
      });
      if (!candidates.length) return null;
      const meshes = candidates.map(c => c.mesh);
      const hits = raycaster.intersectObjects(meshes, false);
      return hits.length ? hits[0].object.userData.card : null;
    }

    const focusPanel = document.getElementById('focus-panel');
    const focusTitle = document.getElementById('focus-title');
    const focusText = document.getElementById('focus-text');
    const FOCUS_ITEMS = [
      { title: 'Холст № 1', text: 'Работа открывает экспозицию мануфактуры: приглушённая палитра и плотная фактура напоминают о материальности ремесла.' },
      { title: 'Холст № 2', text: 'Композиция строится на контрасте света и тени — классический приём, доведённый до тонкой детали.' },
      { title: 'Холст № 3', text: 'Ритм линий и пятен растворяется в глубине полотна, приглашая задержаться у каждой детали.' },
      { title: 'Холст № 4', text: 'Сочетание землистых оттенков передаёт тёплую, почти осязаемую атмосферу мастерской.' },
      { title: 'Холст № 5', text: 'Сдержанная гамма и ясная композиция вписывают работу в строгий ряд мануфактурной коллекции.' }
    ];

    let focusT = 0;
    let othersT = 0;
    let focusCard = null;
    let hoverCard = null;
    let focusDepthTarget = 0;
    let prevTarget = 0;

    function focusMode() {
      const hit = cardUnderCursor();
      if (!hit) return;
      focusCard = hit;
      prevTarget = target;
      if (mode === 'corridor') {
        // Camera dives to stop ~6.5 units in front of the card's slot (never through it)
        const n = Math.floor((camera.position.z - hit.baseline) / LOOP);
        let cz = hit.baseline + n * LOOP;
        while (cz - camera.position.z > 0) cz -= LOOP; // pick the instance ahead (more-negative z)
        let dTarget = -cz - 6.5;
        // If the card is already closer than 6.5 units, don't travel backward / don't spring.
        // Clamp the target so the camera never reverses past its current depth.
        if (dTarget < depth) dTarget = depth;
        focusDepthTarget = dTarget;
        target = depth;
      } else {
        // Tiles: keep the camera in place, focus is a pure scale-up in the tape.
        focusDepthTarget = depth;
      }
      const info = FOCUS_ITEMS[hit.index % FOCUS_ITEMS.length];
      focusTitle.textContent = info.title;
      focusText.textContent = info.text;
      focusPanel.classList.add('visible');
      hintEl.style.opacity = 0;
      document.body.classList.add('focused');
      focusCursorEl.classList.add('focus');
      focusCursorEl.classList.remove('hover');
    }

    function unfocus() {
      if (focusCard) target = prevTarget || depth;
      focusCard = null;
      focusDepthTarget = 0;
      focusPanel.classList.remove('visible');
      document.body.classList.remove('focused');
      focusCursorEl.classList.remove('focus');
      if (mode === 'corridor' && depth < 25) hintEl.style.opacity = 1;
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#mode-toggle')) return;
      if (focusCard) { unfocus(); return; }
      focusMode();
    });

    // ===== Mode toggle button + hotkey (T) =====
    const modeToggle = document.getElementById('mode-toggle');
    const modeSegs = modeToggle.querySelectorAll('.seg');
    function applyModeUI() {
      modeToggle.setAttribute('data-mode', mode);
      modeSegs.forEach(s => s.classList.toggle('active', s.dataset.seg === mode));
    }
    function switchMode(next) {
      if (next === mode) return;
      if (focusCard) unfocus();
      // Both directions open/close from the tape's top, so the gather/re-spread in
      // and out of the corridor always mirrors the page-start state regardless of
      // how far (or which way) the tape was scrolled. Snapping scroll instantly is
      // invisible because the mode blend covers the jump.
      tileScroll = 0;
      tileScrollTarget = 0;
      mode = next;
      blendTarget = mode === 'tiles' ? 1 : 0;
      hintEl.style.display = mode === 'tiles' ? 'none' : '';
      applyModeUI();
    }
    modeToggle.addEventListener('click', () => {
      switchMode(mode === 'corridor' ? 'tiles' : 'corridor');
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyT' || e.code === 'Tab') {
        e.preventDefault();
        switchMode(mode === 'corridor' ? 'tiles' : 'corridor');
      } else if (e.code === 'Escape' && focusCard) {
        unfocus();
      }
    });
    applyModeUI();

    const update = () => {
      const now = performance.now();
      let dt = (now - prevTime) / 1000;
      prevTime = now;
      if (dt > 0.05) dt = 0.05;

      // Ease the focus transition (1 = focused, 0 = normal) and the neighbours fade
      if (focusCard) {
        focusT = Math.min(1, focusT + dt * 1.5);
        // neighbours dissolve a bit faster so they're gone while camera still closes in
        othersT = Math.min(1, othersT + dt * 3.2);
      } else {
        focusT = Math.max(0, focusT - dt * 1.5);
        othersT = Math.max(0, othersT - dt * 1.5);
      }

      // Blend the two layouts; the corridor keeps its classic cascade while blending,
      // and its focus-dive only applies while we're still on the corridor side.
      const inCorridor = blend < 0.5;
      if (focusCard && inCorridor) {
        depth += (focusDepthTarget - depth) * (1 - Math.exp(-dt * 3.2));
        mid = depth;
        target = depth;
      } else {
        mid += (target - mid) * (1 - Math.exp(-dt * 6));
        depth += (mid - depth) * (1 - Math.exp(-dt * 4));
      }

      // Smooth the mode transition and the vertical tape scroll
      blend += (blendTarget - blend) * (1 - Math.exp(-dt * BLEND_SPEED));
      tileScroll += (tileScrollTarget - tileScroll) * (1 - Math.exp(-dt * 6));

      const z = -depth;
      // The tiles tape lives on the corridor's current depth plane, so switching
      // modes only steps the camera back a bit instead of flying across the whole corridor.
      const tilePlaneZ = z;
      const camY = 1.7 + (tileScroll - 1.7) * blend;
      const camZ = z + TILE_CAM_Z * blend;
      camera.position.set(0, camY, camZ);
      const camFrom = camLookV.set(0, camY, camZ - 10);
      const camTo = camLookP.set(0, tileScroll, tilePlaneZ);
      camLook.lerpVectors(camFrom, camTo, blend);
      camera.lookAt(camLook);

      // Keep corridor spotlights following the traveler (lights always on)
      lights.forEach(L => {
        let lz = L.base + Math.floor((z - L.base) / LIGHT_LOOP) * LIGHT_LOOP;
        while (lz - z > LIGHT_LOOP) lz -= LIGHT_LOOP;
        L.light.position.set(0, corridorHeight - 0.4, lz);
      });

      // Place cards. Every card gets a corridor position and a tiles position;
      // `blend` interpolates between them, so the re-arrangement is one smooth shot.
      cards.forEach(card => {
        const n = Math.floor((z - card.baseline) / LOOP);
        let cz = card.baseline + n * LOOP;
        while (cz - z < -30) cz += LOOP;
        while (cz - z > 30) cz -= LOOP;

        const focusing = card === focusCard;
        const t = focusing ? focusT : focusCard ? othersT : 0;

        // ---- Corridor placement ----
        let cx = card.x, cy = card.y, czz = cz, csc = 1, cop = 1;
        if (focusing && inCorridor) {
          // The chosen card glides to the screen centre & grows, stays at its slot depth
          cx = 0 * t;
          cy = 1.8 * t + card.y * (1 - t);
          csc = 1.25 + 0.25 * t;
          cop = 1;
        } else if (focusCard && inCorridor) {
          cx = card.x;
          cy = card.y;
          csc = 1;
          cop = 1 - t;
        }

        // ---- Tiles placement (2 columns, vertical tape) ----
        const col = card.index % 2;
        const r0 = Math.floor(card.index / 2);
        let ty = -(r0) * TILE_ROW_GAP + Math.floor((tileScroll + r0 * TILE_ROW_GAP) / TILE_PERIOD_Y) * TILE_PERIOD_Y;
        while (ty - tileScroll < -TILE_VIEW) ty += TILE_PERIOD_Y;
        while (ty - tileScroll > TILE_VIEW) ty -= TILE_PERIOD_Y;
        let tx = col === 0 ? -TILE_COL_SPREAD : TILE_COL_SPREAD;
        let tz = tilePlaneZ, tsc = 1, top = 1;
        if (focusing && !inCorridor) {
          // Tile focus: the card moves to the exact screen centre and grows in place
          tx = 0;
          ty = tileScroll;
          tz = tilePlaneZ;
          tsc = 1.25 + 0.25 * t;
          top = 1;
        } else if (focusCard && !inCorridor) {
          tx = col === 0 ? -TILE_COL_SPREAD : TILE_COL_SPREAD;
          tsc = 1;
          top = 1 - t;
        }

        // ---- Blend the two placements ----
        let x = cx + (tx - cx) * blend;
        let y = cy + (ty - cy) * blend;
        let zz = czz + (tz - czz) * blend;
        let sc = csc + (tsc - csc) * blend;
        let op = cop + (top - cop) * blend;

        // Parallax: the hovered card leans toward the cursor like it's glued to it.
        // Applied in both corridor and tiles so hovering behaves identically.
        const isHover = card === hoverCard && !focusCard;
        if (card.parX === undefined) { card.parX = 0; card.parRot = 0; }
        const pxT = isHover ? mouse.x * 0.45 : 0;
        const prT = isHover ? mouse.x * 0.12 : 0;
        card.parX += (pxT - card.parX) * (1 - Math.exp(-dt * 10));
        card.parRot += (prT - card.parRot) * (1 - Math.exp(-dt * 10));
        x += card.parX;

        // Fully hide cards so they can't double-draw or leave halos
        card.mesh.visible = op > 0.02;
        card.mesh.position.set(x, y, zz);
        // Scale X/Z uniformly for the focus zoom; Y also holds the true picture aspect
        card.mesh.scale.set(sc, sc * card.aspect, sc);
        card.mesh.material.opacity = Math.max(0, op);
        card.mesh.material.transparent = true;
        card.mesh.rotation.y = focusing ? 0 : card.parRot;
        card.mesh.rotation.x = 0;
        card.mesh.rotation.z = 0;
      });

      const prog = Math.min(1, depth / 16);
      if (prog > 0.01 || blend > 0.01) {
        if (!focusCard) titleCard.style.opacity = (1 - prog) * (1 - blend);
        if (!focusCard) hintEl.style.opacity = (1 - prog * 1.5) * (1 - blend);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(update);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      const flicker = document.getElementById('flicker');
      flicker.style.transition = 'opacity 0.1s';
      flicker.style.opacity = '0';
      setTimeout(() => { flicker.style.display = 'none'; }, 200);
    }, 800);

    update();
  </script>
</body>
</html>
